[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "openframe-studio"
version = "0.1.0"
description = "OpenSeesPy 2D structural model visualization and analysis desktop application"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "PySide6>=6.8",
  "openseespy>=3.8.0.0",
  # Also used directly by openframe itself now (buckling_solver.py's stiffness
  # matrix reshape) - kept installed either way so uploaded OpenSeesPy scripts
  # that import it (a very common pattern for post-processing/plotting) can run
  # in the worker subprocess instead of crashing on import.
  "numpy>=1.26",
  # buckling_solver.py's generalized eigenvalue solve (scipy.linalg.eig) - not
  # used elsewhere in openframe.
  "scipy>=1.11",
  "matplotlib>=3.8",
  "openpyxl>=3.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=6.0",
  "ruff>=0.9",
]

[project.scripts]
openframe = "openframe.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
openframe = [
  "features/viewport/presentation/qml/*.qml",
  "infrastructure/ground_motions/data/*.AT2",
  "infrastructure/material_section_db/data/*.xlsx",
  "infrastructure/material_section_db/data/*.json",
  "resources/icons/*",
  "resources/fonts/*.ttf",
  "resources/templates/*.json",
  "resources/templates/*.ofsm",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"
