[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "openframe-studio"
version = "0.1.0"
description = "OpenSeesPy 2D structural model visualization and analysis desktop application"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "PySide6>=6.8",
  "openseespy>=3.8.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=6.0",
  "ruff>=0.9",
]

[project.scripts]
openframe = "openframe.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

